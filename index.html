<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <center>
    <h1>Ticket Reservation Form</h1>
    <label for="">Name</label><br>
    <input type="text" placeholder="First">
    <input type="text" placeholder="Last"><br>

    <label for="">Mailing Address</label><br>
    <input type="text" placeholder="Street Address"><br>
    <input type="text" placeholder="Street Address Line 2"><br>
    <input type="text" placeholder="City">
    <input type="text" placeholder="Region"><br>
    <input type="text" placeholder="Poster/ Zip Code">
    <select name="" id="">
      <option value="">Country</option>
      <option value="">Nigeria</option>
      <option value="">Ghana</option>
      <option value="">United State Of America</option>
      <option value="">Canada</option>
      <option value="">United Kingdom</option>
    </select><br>

    <label for="">Email Address</label>
    <label for="">Contact phone</label><br>
    <input type="text">
    <input type="text" placeholder="### ### ####"><br>
    <div>
      <label for="">Adult</label>
      <p>$25.00</p>
      <label for="">Quantity</label><br>
      <input type="text" placeholder="1"><br>
      <button>Add to cart</button>
      <p>April 28th Friday 8pm</p>
    </div>

    <div>
      <label for="">Children&Students</label>
      <p>$15.00</p><br>
      <label for="">Quantity</label>
      <input type="text" placeholder="0">
      <button>Add to cart</button>
      <p>April 28th Friday 8pm</p>
    </div>
    <h3>Make a Donation</h3>
    <input type="checkbox" id="Donation" name="Donation" value="Donation">
    <label for="">Patron $50.00</label><br>
    <input type="checkbox" id="Donation" name="Donation" value="Donation">
    <label for="">Sponsor $50.00</label>
    <center>
</body>
</html>
